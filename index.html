<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>List Sorter</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>List Sorter</h1>
    /* a textarea for adding a list */
    <textarea id="input" placeholder="Enter your list here..."></textarea>
    /* a dropdown for selecting the sort order */
    <label for="sortOrder">Sort order:</label>

    <select id="sortOrder">
      <option value="az">A-Z</option>
      <option value="za">Z-A</option>
    </select>
    /* a button for sorting the list */
    <button id="sortButton">Sort</button>

    /* a textarea for the result of sorting*/
    <textarea id="output" readonly></textarea>
    /* a button for copying the list */
    <button id="copyButton">Copy</button>
    /* a button for emptying the list */
    <button id="clearButton">Clear</button>
    /* reference to script.js file */
    <script src="script.js"></script>
  </body>
</html>
